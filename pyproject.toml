# QLab declares NO package of its own (hard rule 0). The engine is `qversus` from PyPI, pinned in
# requirements.txt; the precompute tooling under data-pipeline/ is invoked by path (data-pipeline/run.py).
# Only tool configuration lives here.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
