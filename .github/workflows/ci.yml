name: CI

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Cheap checks only (ADR-0074): the product test suite runs locally, the engine's physics tests run in
      # the qversus repository, and the real-hardware lane never runs on CI. Installing requirements.txt
      # proves the qversus pin resolves from PyPI (NumPy-only core).
      - name: Install the engine (qversus from PyPI) and the dev tools
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Manifests clear the measured gate and match their artifacts (ADR-0054)
        run: python scripts/check_manifests.py
  guards:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Public-repo guards
        run: |
          fail=0
          if git ls-files | grep -qE '(^|/)\.env(\..+)?$' && ! git ls-files | grep -qx '.env.example'; then
            echo "::error::a real .env is tracked"; fail=1
          fi
          if git ls-files | grep -qiE '\.(npy|npz|h5|parquet)$'; then
            echo "::error::raw/heavy data tracked, commit compact JSON traces only (see data/README.md)"; fail=1
          fi
          # No local machine paths in tracked files (this guard file itself is excluded).
          if git grep -nIE 'D:\\_Repos|/d/_Repos|C:\\Users\\' -- ':!.github/**' ; then
            echo "::error::a local machine path leaked into a tracked file"; fail=1
          fi
          exit $fail
      - name: No package of its own (hard rule 0; the engine is qversus from PyPI)
        run: |
          fail=0
          if grep -qE '^\[project\]|^\[tool\.setuptools' pyproject.toml; then
            echo "::error::pyproject.toml declares a package; it keeps tool configuration only"; fail=1
          fi
          if git grep -nE 'python -m qlab|pip install -e \.' -- ':!CHANGELOG.md' ':!.github/**'; then
            echo "::error::an internal package invocation is back"; fail=1
          fi
          if [ -d qlab ]; then echo "::error::the internal package directory qlab/ is back"; fail=1; fi
          exit $fail
      - name: Version sources agree (VERSION, web/package.json, CHANGELOG, README)
        run: python3 scripts/check_versions.py
      - name: CI budget, trunk-only triggers, no training (ADR-0074)
        run: python3 scripts/check_ci_budget.py
      - name: No em-dash and no emoji in tracked content (ADR-0067)
        run: python3 scripts/check_content_standards.py
